version: '3.8'

services:
  gnss:
    build:
      context: .
      dockerfile: Dockerfile
    image: unicore_gnss:latest
    container_name: unicore_gnss
    
    # Mount serial device where UM982 is connected
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    
    # Use host network for ROS 2 DDS communication
    network_mode: host
    
    # Keep running unless stopped
    restart: unless-stopped
    
    # Optional: environment variables for ROS 2
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    
    # Optional: mount a custom config (override um982.yaml)
    # volumes:
    #   - ./config/um982.yaml:/opt/unicore_gnss/share/unicore_gnss/config/um982.yaml:ro
