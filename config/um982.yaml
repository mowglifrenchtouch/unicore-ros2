um982_node:
  ros__parameters:
    port: /dev/gps
    baudrate: 921600
    frame_id: gps
    data_timeout_sec: 1.0
    reconnect_interval_sec: 1.0
    read_poll_hz: 200.0
    fix_topic: /gps/fix
    heading_topic: /gps/azimuth
    diagnostics_topic: /gps/diagnostics
    rtcm_topic: /ntrip_client/rtcm
    rtcm_timeout_sec: 5.0
    max_diff_age_sec: 5.0
    enable_rtk_status: true
    enable_rtcm_status: true
    enable_satellite_status: false
    enable_satsinfo: false
    satellite_diag_timeout_sec: 5.0
    enable_rf_status: false
    enable_hw_status: false
    enable_jamming_status: false
    rf_diag_timeout_sec: 5.0
    enable_raw_observation_diag: false
    use_binary_raw_observations: false
    raw_observation_timeout_sec: 5.0
    raw_observation_max_debug_entries: 0
    enable_unicore_binary: false
    binary_parser_strict_crc: true
    binary_max_frame_size: 4096
    binary_debug_unknown_ids: false
    use_binary_nav: false
    binary_compare_ascii: true
    binary_nav_timeout_sec: 2.0
    use_binary_rtk_diag: false
    use_binary_satellite_diag: false
    use_binary_rtcm_diag: false
    use_binary_rf_diag: false
    use_binary_hw_diag: false
    use_binary_jamming_diag: false
